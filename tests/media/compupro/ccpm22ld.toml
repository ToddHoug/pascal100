# CompuPro CP/M 2.2LD on the Disk 1A, for acceptance-disk1a (tests/acceptance/disk1a.cmake).
#
# The `disk1a` machine (machine-disk1a.toml, a built-in until 2026-11-14) with CCPM22LD.DSK in drive 0. The test copies this folder out
# of the tree first, so the guest never writes to the tracked image.

[machine]
name = "disk1a-ccpm22ld"
base = "machine-disk1a.toml"

[[board]]
id = "fd0"

  [[board.drive]]
  unit  = 0
  mount = "CCPM22LD.DSK"
