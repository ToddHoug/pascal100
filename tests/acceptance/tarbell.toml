# Tarbell single-density boot acceptance fixture: the #1011 controller with the 48K
# CP/M 2.2 SSSD master in drive 0, mounted READ-ONLY so the test can never dirty the
# tracked image (the boot only reads; tarbell.exp shasums it to prove it).

[machine]
name = "tarbell-acceptance"
base = "machine-tarbell.toml"
startup = ["RUN 0"]   # the built-in tarbell does not run at startup: it has no disk

[[board]]
type = "tarbell"
id   = "fdc0"

  [[board.drive]]
  unit         = 0
  mount        = "../media/tarbell/CPM22b15-48K-SSSD.DSK"
  writeprotect = true

[console]
bsdel = "bs"
